<app-navbar></app-navbar>

<main role="main">
  <div class="p-5 mb-4 bg-body-tertiary rounded-3">
    <div class="container">
      @if (appVisible) {
        <app-main></app-main>
      } @else {
        <app-disclaimer></app-disclaimer>
        <div class="row">
          <div class="col-md-4"></div>
          <button class="btn btn-outline-danger col-md-4" (click)="showApp()">I understand, take me to the app</button>
          <div class="col-md-4"></div>
        </div>
      }
    </div>
  </div>

  <app-footer></app-footer>
</main>
