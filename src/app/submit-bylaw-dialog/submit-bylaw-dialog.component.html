<div>
  <h1>Request addition of a new bylaw</h1>
  <br><br>
  <div>
    <label>Select Bylaw year: </label>
    <div class="btn-group elective-group">
      @for (year of getMissingBylawsYears(); track year) {
        <button (click)="selectBylaw(year)"
                [class]="bylawButtonClass(year)"
                [disabled]="bylawYear === year">
          {{year}}
        </button>
      }
    </div>
  </div>
  <br><br>
  <div>
    <label for="file">Choose bylaw PDF file:</label>
    <input id="file" type="file" accept="application/pdf" (change)="handleFileInput($event)">
  </div>
  <br><br>
  <div>
    <button class="btn btn-danger" (click)="onNoClick()">Cancel</button>
    <button class="btn btn-primary" (click)="submit()">Upload</button>
    @if (isUploading) {
      <p>Uploading. Please wait...</p>
    }
  </div>
</div>
